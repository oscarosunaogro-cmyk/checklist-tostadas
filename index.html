<style>

    --green:#2E7D52;
    --green-soft:#DCEFE3;
    --red:#B23A32;
    --bg:#F3F2EE;
    --surface:#FFFFFF;
    --line:#E3E0D8;
    --text:#1D2226;
    --text-mut:#5B6570;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  @font-face{ font-family:'__preload'; src:local('a'); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* ---------- header ---------- */

    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding:18px 20px 16px;
    box-shadow:0 4px 14px rgba(8,36,57,.25);
  }
  .topbar-inner{ max-width:960px; margin:0 auto; }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--orange-soft); display:flex; align-items:center; gap:8px; margin-bottom:6px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--orange); box-shadow:0 0 0 3px rgba(217,122,34,.25);}
  h1{
    font-family:var(--cond); font-weight:600; font-size:24px; line-height:1.15;
    margin:0 0 2px; letter-spacing:.2px;
  }
  .article-name{ font-size:13.5px; color:#C9D6DD; margin:0 0 14px; }
  .article-name b{ color:#fff; font-weight:600; }

  .progress-wrap{ display:flex; align-items:center; gap:14px; }
  .progress-track{
    flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,.14);
    overflow:hidden; position:relative;
  }
  .progress-fill{
    height:100%; border-radius:6px;
    background:linear-gradient(90deg,var(--orange), #E9A65A);
    transition:width .4s ease;
  }
  .progress-fill.done{ background:linear-gradient(90deg,var(--green), #4CA576); }
  .progress-nums{ font-family:var(--mono); font-size:13px; white-space:nowrap; color:#fff; }
  .progress-nums b{ font-size:15px; }
  .progress-pct{ color:var(--orange-soft); }

  /* ---------- controls ---------- */
  .controls{
    position:sticky; top:104px; z-index:25;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
  }
  .controls-inner{
    max-width:960px; margin:0 auto;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  input[type=search], select{
    font-family:var(--sans); font-size:13.5px;
    border:1px solid var(--line); background:var(--surface);
    border-radius:8px; padding:9px 11px; color:var(--text);
  }
  input[type=search]{ flex:1 1 220px; min-width:160px; }
  input[type=search]:focus, select:focus{ outline:2px solid var(--navy); outline-offset:1px; }
  select{ flex:0 0 auto; cursor:pointer; }
  .btn-export{
    flex:0 0 auto; font-family:var(--sans); font-weight:600; font-size:12.5px;
    padding:9px 14px; border-radius:8px; border:1px solid var(--navy);
    background:var(--navy); color:#fff; cursor:pointer; display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .btn-export:hover{ filter:brightness(1.12); }
  .btn-export:disabled{ opacity:.6; cursor:wait; }
  .chip-row{ display:flex; gap:6px; max-width:960px; margin:10px auto 0; padding:0 20px; flex-wrap:wrap; }
  .chip{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.03em;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--text-mut); cursor:pointer; user-select:none;
    transition:all .15s ease;
  }
  .chip.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip .n{ opacity:.7; margin-left:3px; }

  /* ---------- list ---------- */
  main{ max-width:960px; margin:0 auto; padding:18px 20px 60px; }
  .region-group{ margin-bottom:22px; }
  .region-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; cursor:pointer; user-select:none;
  }
  .region-title{
    font-family:var(--cond); font-weight:600; font-size:16px; letter-spacing:.02em;
    display:flex; align-items:center; gap:8px;
  }
  .region-title .caret{ transition:transform .18s ease; color:var(--text-mut); font-size:12px; }
  .region-group.collapsed .caret{ transform:rotate(-90deg); }
  .region-count{
    font-family:var(--mono); font-size:12px; color:var(--text-mut);
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:3px 8px;
  }
  .region-count b{ color:var(--green); }
  .region-list{ display:flex; flex-direction:column; gap:8px; }
  .region-group.collapsed .region-list{ display:none; }

  .store-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; display:flex; align-items:center; gap:12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .store-card.confirmed{ border-color:#B9DCC5; background:var(--green-soft); }
  .store-card:hover{ box-shadow:0 2px 10px rgba(11,51,80,.06); }

  .status-dot{
    flex:0 0 auto; width:11px; height:11px; border-radius:50%;
    background:var(--orange); box-shadow:0 0 0 3px rgba(217,122,34,.16);
  }
  .store-card.confirmed .status-dot{ background:var(--green); box-shadow:0 0 0 3px rgba(46,125,82,.16); }

  .store-info{ flex:1; min-width:0; }
  .store-name{ font-weight:600; font-size:14.5px; line-height:1.25; }
  .store-meta{
    font-family:var(--mono); font-size:11.5px; color:var(--text-mut);
    margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;
  }
  .store-meta span b{ color:var(--text); font-weight:600; }
  .store-meta .zona-tag{ color:var(--navy); }

  .exist-badge{
    flex:0 0 auto; text-align:right; font-family:var(--mono); font-size:11px; color:var(--text-mut);
    line-height:1.5; min-width:64px;
  }
  .exist-badge b{ display:block; font-size:15px; color:var(--text); font-weight:600; }

  .btn{
    flex:0 0 auto; font-family:var(--sans); font-weight:600; font-size:12.5px;
    padding:8px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-confirm{ background:var(--navy); color:#fff; }
  .btn-confirm:hover{ filter:brightness(1.12); }
  .btn-view{ background:transparent; color:var(--green); border-color:#B9DCC5; }
  .btn-view:hover{ background:#fff; }

  .empty-state{

  }
  .empty-state .big{ font-family:var(--cond); font-size:19px; color:var(--text); margin-bottom:4px; }

  /* ---------- modal ---------- */

    position:fixed; inset:0; background:rgba(8,20,30,.55);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
    backdrop-filter: blur(2px);
  }
  .overlay.open{ display:flex; }
  @media(min-width:600px){ .overlay{ align-items:center; } }

  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:16px 16px 0 0; max-height:92vh; overflow-y:auto;
    animation:slideUp .22s ease;
    position:relative;
  }

  .modal-head{
    padding:18px 20px 12px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--surface); z-index:2;

    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;

  .modal-sub{ font-size:12.5px; color:var(--text-mut); margin-top:4px; font-family:var(--mono); }

  .modal-body{ padding:16px 20px 22px; }
  .field-label{ font-size:12.5px; font-weight:600; margin:14px 0 6px; color:var(--text); }
  .field-label:first-child{ margin-top:0; }

  .qty-row{ display:flex; gap:10px; }
  .qty-field{ flex:1; position:relative; }
  .qty-input{ padding-right:34px; font-family:var(--mono); font-weight:600; }
  .qty-unit{

  .qty-hint{ font-size:11.5px; color:var(--text-mut); margin-top:6px; line-height:1.4; }
  .qty-summary{

    background:var(--bg); border-radius:9px; padding:10px; color:var(--text);
  }

  .photo-drop{
    border:1.5px dashed var(--line); border-radius:12px; padding:18px;
    text-align:center; cursor:pointer; background:var(--bg); position:relative; overflow:hidden;

  .photo-drop .hint{ font-size:12.5px; color:var(--text-mut); }
  .photo-drop .hint b{ color:var(--navy); }
  .photo-drop .icon{ font-size:26px; margin-bottom:6px; display:block; }
  .photo-actions{

    width:100%; font-family:var(--sans); font-size:13.5px; border:1px solid var(--line);

  .btn-primary:disabled{ background:#B9C2C9; cursor:not-allowed; }
  .btn-danger-ghost{ background:transparent; color:var(--red); border:1px solid #E7C6C2; flex:0 0 auto; padding:13px 16px; }

  .confirm-meta{ font-family:var(--mono); font-size:12px; color:var(--text-mut); text-align:center; margin-top:8px; }

    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.25);

  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .shared-note{
    max-width:960px; margin:0 auto; padding:10px 20px 0;
    font-size:11.5px; color:var(--text-mut); font-family:var(--mono);

  .loading-line{ text-align:center; padding:40px; color:var(--text-mut); font-family:var(--mono); font-size:13px; }
</style>
</head>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const statusDocRef = db.collection('checklist').doc('status');
const photosCollection = db.collection('photos');

let statusMap = {}; // idTienda -> {confirmed, confirmedAt, confirmadoPor, notas, hasPhoto, piezasDevueltas, cajasDevueltas, descargadoBrisa, descargadoBrisaAt}
let collapsedRegions = new Set();
let currentModalStore = null;
let pendingPhotoBase64 = null;

const el = id => document.getElementById(id);

/* ============ INIT ============ */
async function init(){
  populateRegionFilter();
  await loadStatus();
  render();
  bindControls();
  listenForLiveUpdates();
}

function listenForLiveUpdates(){
  statusDocRef.onSnapshot(doc=>{
    statusMap = doc.exists ? (doc.data() || {}) : {};
    render();
  }, err=>{
    console.error('Error de sincronización en vivo', err);
  });
}

function populateRegionFilter(){
  const regions = [...new Set(STORES.map(s=>s.region))].sort();
  const sel = el('regionFilter');
  regions.forEach(r=>{
    const o = document.createElement('option');
    o.value = r; o.textContent = titleCase(r);
    sel.appendChild(o);
  });
}

async function loadStatus(){
  try{
    const doc = await statusDocRef.get();
    statusMap = doc.exists ? (doc.data() || {}) : {};
  }catch(e){
    statusMap = {};
  }
  el('sharedNote').textContent = '● Este checklist es compartido: los avances de confirmación se sincronizan en vivo para todos los que abran este enlace.';
}

async function saveStatus(){
  try{
    await statusDocRef.set(statusMap);
  }catch(e){
    showToast('No se pudo guardar. Intenta de nuevo.');
  }
}

/* ============ RENDER ============ */
function titleCase(s){
  return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function fmtDate(iso){
  return new Date(iso).toLocaleString('es-MX', {dateStyle:'medium', timeStyle:'short'});
}

function getFiltered(){
  const q = el('searchInput').value.trim().toLowerCase();
  const region = el('regionFilter').value;
  const status = el('statusFilter').value;
  return STORES.filter(s=>{
    if(region && s.region !== region) return false;
    const st = statusMap[s.idTienda];
    const confirmed = !!(st && st.confirmed);
    if(status === 'pending' && confirmed) return false;
    if(status === 'confirmed' && !confirmed) return false;
    if(status === 'brisa_pending' && !(confirmed && !st.descargadoBrisa)) return false;
    if(status === 'brisa_done' && !(st && st.descargadoBrisa)) return false;
    if(q){
      const hay = (s.tienda + ' ' + s.idTienda + ' ' + s.zona).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function updateProgress(){
  const total = STORES.length;
  const done = STORES.filter(s => statusMap[s.idTienda] && statusMap[s.idTienda].confirmed).length;
  const pct = total ? Math.round(done/total*100) : 0;
  el('progCount').textContent = done;
  el('progPct').textContent = pct + '%';
  const fill = el('progressFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('done', pct === 100);
}

function render(){
  updateProgress();
  const filtered = getFiltered();
  const main = el('mainContent');

  if(filtered.length === 0){
    main.innerHTML = `<div class="empty-state"><div class="big">Sin resultados</div>Ajusta la búsqueda o los filtros.</div>`;
    return;
  }

  const byRegion = {};
  filtered.forEach(s=>{
    (byRegion[s.region] = byRegion[s.region] || []).push(s);
  });

  const regionOrder = Object.keys(byRegion).sort();
  main.innerHTML = regionOrder.map(region=>{
    const stores = byRegion[region].sort((a,b)=> a.tienda.localeCompare(b.tienda));
    const doneCount = stores.filter(s => statusMap[s.idTienda] && statusMap[s.idTienda].confirmed).length;
    const collapsed = collapsedRegions.has(region);
    return `
    <div class="region-group ${collapsed?'collapsed':''}" data-region="${escAttr(region)}">
      <div class="region-head" data-toggle-region="${escAttr(region)}">
        <div class="region-title"><span class="caret">▾</span>${titleCase(region)}</div>
        <div class="region-count"><b>${doneCount}</b>/${stores.length} confirmadas</div>
      </div>
      <div class="region-list">
        ${stores.map(storeCardHtml).join('')}
      </div>
    </div>`;
  }).join('');

  main.querySelectorAll('[data-toggle-region]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const r = node.getAttribute('data-toggle-region');
      if(collapsedRegions.has(r)) collapsedRegions.delete(r); else collapsedRegions.add(r);
      render();
    });
  });
  main.querySelectorAll('[data-open-id]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      e.stopPropagation();
      openModal(parseInt(node.getAttribute('data-open-id')));
    });
  });
}

function storeCardHtml(s){
  const st = statusMap[s.idTienda];
  const confirmed = !!(st && st.confirmed);
  return `
  <div class="store-card ${confirmed?'confirmed':''}">
    <div class="status-dot"></div>
    <div class="store-info">
      <div class="store-name">${escHtml(titleCase(s.tienda))}</div>
      <div class="store-meta">
        <span>ID <b>${s.idTienda}</b></span>
        <span class="zona-tag">${escHtml(titleCase(s.zona))}</span>
        ${confirmed ? (st.descargadoBrisa
          ? '<span class="brisa-tag">✓ BRISA</span>'
          : '<span class="brisa-tag off">BRISA pendiente</span>') : ''}
      </div>
    </div>
    <div class="exist-badge">
      <b>${s.existPiezas}</b>pz · ${s.existCajas}cj
    </div>
    <button class="btn ${confirmed?'btn-view':'btn-confirm'}" data-open-id="${s.idTienda}">
      ${confirmed ? 'Ver' : 'Confirmar'}
    </button>
  </div>`;
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

/* ============ MODAL ============ */
function openModal(idTienda){
  const store = STORES.find(s => s.idTienda === idTienda);
  if(!store) return;
  currentModalStore = store;
  pendingPhotoBase64 = null;
  photoTouched = false;

  const st = statusMap[idTienda] || {};
  el('modalRegion').textContent = titleCase(store.region) + ' · ' + titleCase(store.zona);
  el('modalTitle').textContent = titleCase(store.tienda);
  el('modalSub').textContent = `ID ${store.idTienda} · Existencia: ${store.existPiezas} pz / ${store.existCajas} cj`;

  if(st.confirmed){
    renderConfirmedView(st);
  }else{
    renderPendingView();
  }
  el('overlay').classList.add('open');
}

    ${st.notas ? `<div class="field-label">Notas</div><div style="font-size:13.5px;color:var(--text-mut);">${escHtml(st.notas)}</div>` : ''}

    <label class="brisa-check ${st.descargadoBrisa?'checked':''}" id="brisaLabel">
      <input type="checkbox" id="brisaCheck" ${st.descargadoBrisa?'checked':''}>
      <span class="t">Descargado en sistema como Mercancía dañada
        <span class="s" id="brisaDate">${brisaSub}</span></span>
    </label>

    <div class="modal-footer">
      <button class="btn-danger-ghost" id="undoBtn">Deshacer confirmación</button>
    </div>
  `;
  if(st.hasPhoto){
    el('photoViewer').addEventListener('click', ()=> loadAndShowPhoto(currentModalStore.idTienda));
  }
  el('undoBtn').addEventListener('click', undoConfirmation);
  el('brisaCheck').addEventListener('change', toggleBrisa);
}

async function toggleBrisa(e){
  const checked = e.target.checked;
  const id = currentModalStore.idTienda;
  const at = checked ? new Date().toISOString() : null;
  statusMap[id] = { ...statusMap[id], descargadoBrisa: checked, descargadoBrisaAt: at };
  el('brisaLabel').classList.toggle('checked', checked);
  el('brisaDate').textContent = checked
    ? 'A través de BRISA · ' + fmtDate(at)
    : 'A través de BRISA';
  try{
    // merge: solo toca esta tienda, no sobrescribe lo que otros confirmen al mismo tiempo
    await statusDocRef.set({ [id]: { descargadoBrisa: checked, descargadoBrisaAt: at } }, { merge:true });
    showToast(checked ? 'Marcada como descargada en BRISA' : 'Check de BRISA quitado');
  }catch(err){
    showToast('No se pudo guardar. Intenta de nuevo.');
  }
  render();
}

async function loadAndShowPhoto(idTienda){
  const viewer = el('photoViewer');
  viewer.innerHTML = `<div class="hint">Cargando foto…</div>`;
  try{
    const doc = await photosCollection.doc(String(idTienda)).get();
    if(doc.exists && doc.data() && doc.data().photo){
      viewer.classList.add('has-photo');
      viewer.innerHTML = `<img src="${doc.data().photo}" alt="Soporte de resguardo">`;
    }else{
      viewer.innerHTML = `<div class="hint">No se encontró la fotografía.</div>`;
    }
  }catch(e){
    viewer.innerHTML = `<div class="hint">No se pudo cargar la fotografía.</div>`;
  }
}

function handlePhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhotoBase64 = canvas.toDataURL('image/jpeg', 0.62);
      photoTouched = true;
      const drop = el('photoDrop');
      drop.classList.add('has-photo');
      drop.innerHTML = `<img src="${pendingPhotoBase64}" alt="Vista previa">
        <div class="photo-actions"><button id="retakeBtn">Cambiar foto</button></div>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">`;
      el('retakeBtn').addEventListener('click', (ev2)=>{ ev2.stopPropagation(); el('photoInput').click(); });
      el('photoInput').addEventListener('change', handlePhotoSelect);
      drop.onclick = (ev3)=>{ if(ev3.target.id !== 'retakeBtn') el('photoInput').click(); };
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitConfirmation(){
  // Si quieres que el check de BRISA sea obligatorio, descomenta estas 3 líneas:
  // if(!el('brisaCheck').checked){
  //   showToast('Marca la descarga en BRISA'); return;
  // }

  const btn = el('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const idTienda = currentModalStore.idTienda;
  const confirmadoPor = el('confirmadoPor').value.trim();
  const notas = el('notas').value.trim();
  const piezasRaw = el('piezasDevueltas').value;
  const cajasRaw = el('cajasDevueltas').value;
  const piezasDevueltas = piezasRaw === '' ? 0 : Math.max(0, parseInt(piezasRaw, 10) || 0);
  const cajasDevueltas = cajasRaw === '' ? 0 : Math.max(0, parseInt(cajasRaw, 10) || 0);
  const brisa = el('brisaCheck').checked;

  statusMap[idTienda] = {
    confirmed: true,
    confirmedAt: new Date().toISOString(),
    confirmadoPor: confirmadoPor || null,
    notas: notas || null,
    hasPhoto: !!pendingPhotoBase64,
    piezasDevueltas: piezasDevueltas,
    cajasDevueltas: cajasDevueltas,
    descargadoBrisa: brisa,
    descargadoBrisaAt: brisa ? new Date().toISOString() : null
  };

  if(pendingPhotoBase64){
    try{
      await photosCollection.doc(String(idTienda)).set({ photo: pendingPhotoBase64 });
    }catch(e){
      showToast('Se confirmó, pero la foto no pudo guardarse.');
    }
  }

  await saveStatus();
  closeModal();
  render();
  showToast('Resguardo confirmado');
}

async function undoConfirmation(){
  const idTienda = currentModalStore.idTienda;
  delete statusMap[idTienda];
  await saveStatus();
  try{ await photosCollection.doc(String(idTienda)).delete(); }catch(e){}
  closeModal();
  render();
  showToast('Confirmación deshecha');
}

function closeModal(){
  el('overlay').classList.remove('open');
  currentModalStore = null;
}

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ============ CONTROLS ============ */
function bindControls(){
  el('searchInput').addEventListener('input', render);
  el('regionFilter').addEventListener('change', render);
  el('statusFilter').addEventListener('change', render);
  el('modalClose').addEventListener('click', closeModal);
  el('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  el('exportBtn').addEventListener('click', exportToExcel);
}

/* ============ EXPORT TO EXCEL ============ */
async function exportToExcel(){
  const btn = el('exportBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando…';

  try{
    // refresh status in case another user confirmed something since page load
    await loadStatus();

    const rows = STORES.map(s=>{
      const st = statusMap[s.idTienda] || {};
      const confirmed = !!st.confirmed;
      return {
        'Región': titleCase(s.region),
        'Zona': titleCase(s.zona),
        'ID Tienda': s.idTienda,
        'Tienda': titleCase(s.tienda),
        'Artículo': s.articulo,
        'ID Artículo': s.idArticulo,
        'Existencia Piezas': s.existPiezas,
        'Existencia Cajas': s.existCajas,
        'Estatus': confirmed ? 'Confirmado' : 'Pendiente',
        'Piezas devueltas': confirmed ? (st.piezasDevueltas ?? '') : '',
        'Cajas devueltas': confirmed ? (st.cajasDevueltas ?? '') : '',
        'Confirmado por': st.confirmadoPor || '',
        'Fecha y hora de confirmación': st.confirmedAt ? fmtDate(st.confirmedAt) : '',
        'Foto adjunta': confirmed ? (st.hasPhoto ? 'Sí' : 'No') : '',
        'Descargado BRISA (Merc. dañada)': confirmed ? (st.descargadoBrisa ? 'Sí' : 'No') : '',
        'Fecha descarga BRISA': st.descargadoBrisaAt ? fmtDate(st.descargadoBrisaAt) : '',
        'Notas': st.notas || ''
      };
    });

    const totalConfirmed = rows.filter(r => r['Estatus'] === 'Confirmado').length;
    const totalPiezasDevueltas = rows.reduce((sum, r) => sum + (typeof r['Piezas devueltas'] === 'number' ? r['Piezas devueltas'] : 0), 0);
    const totalCajasDevueltas = rows.reduce((sum, r) => sum + (typeof r['Cajas devueltas'] === 'number' ? r['Cajas devueltas'] : 0), 0);
    const totalBrisa = rows.filter(r => r['Descargado BRISA (Merc. dañada)'] === 'Sí').length;

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      {wch:16},{wch:20},{wch:10},{wch:28},{wch:32},{wch:12},
      {wch:10},{wch:10},{wch:12},{wch:13},{wch:13},{wch:20},{wch:20},{wch:11},
      {wch:16},{wch:20},{wch:34}
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Movimiento');

    const summaryRows = [
      {Concepto:'Artículo', Valor:'Tostada Best Choice Horneada 300 G'},
      {Concepto:'Total de tiendas', Valor: STORES.length},
      {Concepto:'Confirmadas', Valor: totalConfirmed},
      {Concepto:'Pendientes', Valor: STORES.length - totalConfirmed},
      {Concepto:'Total piezas devueltas', Valor: totalPiezasDevueltas},
      {Concepto:'Total cajas devueltas', Valor: totalCajasDevueltas},
      {Concepto:'Descargadas en BRISA', Valor: totalBrisa},
      {Concepto:'Confirmadas sin descargar en BRISA', Valor: totalConfirmed - totalBrisa},
      {Concepto:'% avance', Valor: Math.round(totalConfirmed/STORES.length*100) + '%'},
      {Concepto:'Generado', Valor: fmtDate(new Date().toISOString())}
    ];
    const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    wsSummary['!cols'] = [{wch:34},{wch:34}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Resumen');

    const dateTag = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `movimiento-retiro-tostada-${dateTag}.xlsx`);

    render(); // reflect any refreshed statuses
    showToast('Excel generado');
  }catch(e){
    showToast('No se pudo generar el Excel');
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

init();
</script>
